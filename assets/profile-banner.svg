<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
  <title id="title">千泷QAQ — AI product manager and builder</title>
  <desc id="desc">A light terminal window introducing research, model evaluation, product thinking, and building in public.</desc>
  <defs>
    <linearGradient id="window" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7fafc"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#9bb3c5" fill-opacity=".20"/>
    </pattern>
    <clipPath id="frame"><rect x="2" y="2" width="996" height="476" rx="22"/></clipPath>
  </defs>
  <rect x="1" y="1" width="998" height="478" rx="23" fill="url(#window)" stroke="#d8e2eb" stroke-width="2"/>
  <g clip-path="url(#frame)">
    <rect x="2" y="2" width="996" height="62" fill="#f0f5f8"/>
    <path d="M2 64h996" stroke="#d8e2eb" stroke-width="2"/>
    <rect x="706" y="65" width="292" height="413" fill="url(#dots)"/>
    <path d="M705 64v414" stroke="#e4ebf0"/>
  </g>
  <circle cx="31" cy="33" r="9" fill="#ed6a5f"/>
  <circle cx="58" cy="33" r="9" fill="#f2be4b"/>
  <circle cx="85" cy="33" r="9" fill="#61c454"/>
  <text x="500" y="39" fill="#73889a" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="14" text-anchor="middle" letter-spacing="1">qianlong@studio — build.log</text>
  <g font-family="SFMono-Regular, Menlo, Consolas, monospace">
    <text x="40" y="108" fill="#3578b8" font-size="17" font-weight="700">$ whoami</text>
    <text x="40" y="149" fill="#1d3141" font-size="32" font-weight="700">千泷QAQ</text>
    <text x="40" y="177" fill="#64798a" font-size="16">AI Product Manager  /  AI Builder &amp; Creator</text>
    <text x="40" y="229" fill="#3578b8" font-size="17" font-weight="700">$ trace --journey</text>
    <text x="40" y="261" fill="#344b5d" font-size="16">AI data  →  SFT  →  model evaluation  →  products</text>
    <text x="40" y="311" fill="#3578b8" font-size="17" font-weight="700">$ build --with-evidence</text>
    <text x="40" y="343" fill="#344b5d" font-size="16">PRDs  ·  prototypes  ·  Agent Skills  ·  open source</text>
    <text x="40" y="400" fill="#2f946a" font-size="17" font-weight="700">✓ learning in public, shipping what works</text>
    <rect x="40" y="426" width="10" height="20" rx="1" fill="#3578b8"/>
    <text x="753" y="163" fill="#9db1c0" font-size="12" letter-spacing="2">PROCESS</text>
    <text x="753" y="208" fill="#668196" font-size="15">01  RESEARCH</text>
    <text x="753" y="251" fill="#668196" font-size="15">02  TEST</text>
    <text x="753" y="294" fill="#668196" font-size="15">03  BUILD</text>
    <text x="753" y="337" fill="#668196" font-size="15">04  EXPLAIN</text>
  </g>
  <path d="M753 369h182" stroke="#d8e2eb" stroke-width="2"/>
  <text x="753" y="397" fill="#9db1c0" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12">v1.0  ·  OPEN TO ITERATION</text>
</svg>
